[project]
name = "mft-project"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4.0"]

[tool.ruff]
exclude = [
    ".env",
    ".venv",
    ".tmp_task001_clone",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "codex_cli/mft_codex_cli.egg-info",
]

[tool.mypy]
files = [
    "project/cli.py",
    "project/cli_commands.py",
    "project/cli_parsers.py",
    "project/cli_support.py",
    "project/cli_utils.py",
    "project/cli_operator.py",
    "project/cli_readonly.py",
    "project/main.py",
    "project/backtesting/research_runner.py",
    "project/research_batch.py",
    "project/research_validation.py",
    "project/strategy_dossier.py",
    "project/hypotheses/catalog.py",
    "project/hypotheses/lifecycle.py",
    "project/hypotheses/registry.py",
    "project/data/db.py",
    "project/data/market_server_loader.py",
    "project/data/repository_base.py",
    "project/data/repository_assets.py",
    "project/data/repository_evaluations.py",
    "project/data/repository_market.py",
    "project/data/repository_research.py",
    "project/data/repository_signals.py",
    "project/data/repository_trading.py",
    "project/data/repository.py",
    "project/data/schema.py",
    "project/data/quality.py",
    "project/data/row_parsers.py",
    "project/data/reporting_store.py",
    "project/data/snapshot_builder.py",
    "project/data/yfinance_loader.py",
    "project/data/market_collector_loader.py",
    "project/replay/engine.py",
    "project/research/__init__.py",
    "project/research/artifacts.py",
    "project/research/config.py",
    "project/research/metrics.py",
    "project/research/models.py",
    "project/research/parameter_grid.py",
    "project/research/promotion.py",
    "project/research/runner.py",
    "project/research/strategies.py",
    "project/research/workbench.py",
    "project/decision/models.py",
]
follow_imports = "silent"
python_version = "3.12"
