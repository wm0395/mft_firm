registry_version: 1
owner_role: VP Data & Platform
sources:
  - source_id: nse_official_reports
    name: NSE official reports and downloads
    base_url: https://www.nseindia.com
    asset_classes:
      - indian_equity_cash
      - indian_etf
      - indian_index
      - nse_equity_derivative
    expected_fields:
      - symbol
      - timestamp
      - trade_date
      - open
      - high
      - low
      - close
      - volume
      - turnover
      - delivery_volume
      - open_interest
      - instrument_type
      - expiry
      - series
    frequency: daily and intraday
    history_depth: archive depth varies by report family
    access_method: download
    free_or_paid: free
    license_status: restricted
    adapter_status: prototype
    data_quality_status: needs_review
    notes: Prototype fixture-backed adapter for exchange reports; official website terms still prohibit automated scraping, and market data usage must stay inside the relevant NSE Data & Analytics agreements and online delivery controls.
    owner_role: "Associate 1: Data Source Associate"
    allowed_use: research use only; respect exchange terms
    rate_limit_notes: Use backoff, session handling, and download throttling.
    freshness: daily
    reliability_rating: high
