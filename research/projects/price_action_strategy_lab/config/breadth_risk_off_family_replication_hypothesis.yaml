# Pre-registered breadth-risk-off family replication. This is not a discovery config.

universe:
  name: all_nse_market_collector
  source: market_collector_native
  database_path: ../runtime/market_collector_central/market.duckdb
  exchange: NSE
  symbol_suffix: ".NS"
  timeframe: 1d
  min_history_days: 252
  max_missing_ratio: 0.15
  require_ohlcv: true

backtests:
  mode: ranked_long_only
  horizon: 10
  cost_bps: [10.0, 25.0, 50.0]
  min_active_names: 20
  top_quantile: 0.8

walk_forward_validation:
  train_size_days: 126
  test_size_days: 21
  step_size_days: 21
  lookahead_days: 10
  max_folds: 24

compute:
  cache_dir: research/projects/price_action_strategy_lab/cache/nse_broad_price_action_alpha_suite
  report_root: research/projects/price_action_strategy_lab/reports/nse_breadth_family_replication
  source_report_dir: research/projects/price_action_strategy_lab/reports/nse_broad_price_action_activator_suite
  max_workers: 6

gpu:
  enabled: true
  backend: auto

variants:
  - variant_id: baseline
    indicator: breadth_risk_off
    throttle_variant: soft_aggressive
  - variant_id: breadth_soft_aggressive
    indicator: breadth_risk_off
    throttle_variant: soft_aggressive
  - variant_id: breadth_drawdown_only
    indicator: breadth_risk_off
    throttle_variant: drawdown_only_throttle

alpha_groups:
  - group_id: structure_level
    alphas:
      - support_trendline_position_20
      - support_resistance_position_20
      - failed_breakout_score_20
      - failed_reversal_score
      - inside_outside_bar_score

  - group_id: reversal_exhaustion
    alphas:
      - doji_reversal_score
      - hammer_shooting_star_score
      - fisher_transform_reversal_10
      - inverse_fisher_rsi_reversal_10
      - bollinger_percent_b_mean_reversion_20
      - stochastic_mean_reversion_14
      - williams_r_mean_reversion_14
